name: UGUIDE-005 producer final publication QA

'on':
  push:
    paths:
      - .github/workflows/ug005-producer-finalise.yml

permissions:
  contents: write

jobs:
  final-publication-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QA dependencies
        run: python3 -m pip install --quiet pillow selenium
      - name: Run bounded UGUIDE-005 Producer script
        run: python3 .github/scripts/ug005_producer_finalise.py
