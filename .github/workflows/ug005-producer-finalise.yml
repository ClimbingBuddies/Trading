name: UGUIDE-005 producer final publication QA

'on':
  push:
    paths:
      - .github/workflows/ug005-producer-finalise.yml

permissions:
  contents: write

jobs:
  final-publication-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install QA dependencies
        run: python3 -m pip install --quiet pillow selenium requests

      - name: Execute UGUIDE-005 Producer gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ClimbingBuddies User Guide Producer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess

          now = datetime.now(ZoneInfo('Australia/Perth')).isoformat(timespec='seconds')
          start = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          journal_path = Path('documentation/user-guide-controller-journal.md')
          journal = journal_path.read_text()
          expected = '''project_status: ACTIVE
active_task: UGUIDE-005
active_task_status: NEXT
handoff_owner: PRODUCER
handoff_status: AUTHORISED
last_updated: 2026-08-26T11:00:46+08:00
completed_task: UGUIDE-004
audit_decision: PASS_WITH_ADVICE
next_action: Producer reads the updated authoritative records, records BUILD_ATTEMPT_STARTED and executes UGUIDE-005 final assembly and publication QA only'''
          replacement = f'''project_status: ACTIVE
active_task: UGUIDE-005
active_task_status: IN PROGRESS
handoff_owner: PRODUCER
handoff_status: IN PROGRESS
last_updated: {now}
completed_task: UGUIDE-004
audit_decision: PASS_WITH_ADVICE
next_action: complete UGUIDE-005 final assembly, production reconciliation and publication QA, then hand to Auditor'''
          if expected not in journal:
              raise SystemExit('UGUIDE-005 current state drifted; refusing to guess.')
          journal = journal.replace(expected, replacement, 1)
          journal += f'''\n\n### {now} — BUILD_ATTEMPT_STARTED\n\n```yaml\nevent: BUILD_ATTEMPT_STARTED\ntask_id: UGUIDE-005\ncontroller: PRODUCER\nstarting_commit: {start}\nplan_state_observed: UGUIDE-001 through UGUIDE-004 DONE; UGUIDE-005 NEXT\nhandoff_observed: AUTHORISED to PRODUCER with UGUIDE-004 PASS_WITH_ADVICE and no unresolved HANDOFF_QUERY\nintended_scope: reconcile canonical guide and route documentation against current production, validate routes/links/images/privacy, clean temporary guide artifacts, link the final guide from documentation/README.md and submit UGUIDE-005 for independent audit only\ntimestamp: {now}\n```\n'''
          journal_path.write_text(journal)
          PY

          git add documentation/user-guide-controller-journal.md
          git commit -m 'docs(UGUIDE-005): start final publication QA'
          START_COMMIT="$(git rev-parse HEAD)"

          python3 - <<'PY'
          from pathlib import Path

          guide_path = Path('documentation/user-guide.md')
          readme_path = Path('documentation/README.md')
          route_path = Path('documentation/frontend-route-map.md')

          guide = guide_path.read_text()
          guide = guide.replace(
              '**Guide status:** public research, private monitoring, Strategy interpretation and operational support documented; UGUIDE-004 is ready for independent audit and final publication QA remains  ',
              '**Guide status:** final publication candidate; all five guide sections/gates are assembled and UGUIDE-005 independent audit is pending  ',
              1,
          )
          guide_path.write_text(guide)

          readme = readme_path.read_text()
          readme = readme.replace(
              '- [Platform user guide](user-guide.md) — canonical deliverable under construction',
              '- [Platform user guide](user-guide.md) — canonical user documentation for the production platform',
              1,
          )
          readme_path.write_text(readme)

          routes = route_path.read_text()
          routes = routes.replace('**Last reconciled:** 25 August 2026', '**Last reconciled:** 26 August 2026', 1)
          routes = routes.replace(
              '| `/` | Redirect to the main Markets workspace | None | Public |',
              '| `/` | Redirect to the Admin operational dashboard | None | Public |',
              1,
          )
          route_path.write_text(routes)
          PY

          git add documentation/user-guide.md documentation/README.md documentation/frontend-route-map.md
          git commit -m 'docs(UGUIDE-005): reconcile final user guide publication'
          FUNCTIONAL_COMMIT="$(git rev-parse HEAD)"

          python3 - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image, ImageStat
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          root = Path('.')
          guide_path = Path('documentation/user-guide.md')
          guide = guide_path.read_text()

          # Repository link/image validation.
          md_link = re.compile(r'(?<!!)\[[^\]]+\]\(([^)]+)\)')
          img_link = re.compile(r'!\[[^\]]*\]\(([^)]+)\)')
          relative_links = []
          for target in md_link.findall(guide):
              target = target.strip().split('#',1)[0]
              if not target or '://' in target or target.startswith('mailto:'):
                  continue
              resolved = (guide_path.parent / target).resolve()
              if not resolved.exists():
                  raise AssertionError(f'broken guide link: {target}')
              relative_links.append(target)
          images = []
          for target in img_link.findall(guide):
              target = target.strip()
              resolved = guide_path.parent / target
              if not resolved.exists():
                  raise AssertionError(f'broken guide image: {target}')
              image = Image.open(resolved)
              image.verify()
              image = Image.open(resolved).convert('RGB')
              stat = ImageStat.Stat(image.convert('L')).stddev[0]
              if stat < 10:
                  raise AssertionError(f'guide image appears blank: {target}')
              images.append((target, image.size, stat))
          if len(images) != 6:
              raise AssertionError(f'expected six delivered guide images under AUTH_REQUIRED exception, found {len(images)}')

          # Ensure every delivered image has non-empty alt text and an immediately-following italic caption.
          lines = guide.splitlines()
          for i, line in enumerate(lines):
              m = re.match(r'!\[([^\]]+)\]\(([^)]+)\)', line.strip())
              if not m:
                  continue
              alt, target = m.groups()
              if len(alt.strip()) < 20:
                  raise AssertionError(f'weak/empty alt text: {target}')
              j = i + 1
              while j < len(lines) and not lines[j].strip():
                  j += 1
              if j >= len(lines) or not (lines[j].strip().startswith('*') and lines[j].strip().endswith('*')):
                  raise AssertionError(f'missing concise caption after image: {target}')

          # Public/privacy wording and auth exception integrity.
          required_phrases = [
              'does **not** place live trades',
              'not personalised financial advice',
              'VALIDATE_ROBUSTNESS / continue_testing',
              'AUTH_REQUIRED — owner screenshot',
              'AUTH_REQUIRED — Strategy screenshot',
              'Compact glossary',
              'Common troubleshooting',
          ]
          for phrase in required_phrases:
              if phrase not in guide:
                  raise AssertionError(f'missing required guide phrase: {phrase}')
          if re.search(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', guide, re.I):
              raise AssertionError('guide contains an email address')
          secret_patterns = [r'eyJ[a-zA-Z0-9_-]{20,}', r'sb_secret_[A-Za-z0-9_-]+', r'service_role', r'sk-[A-Za-z0-9]{20,}']
          for p in secret_patterns:
              if re.search(p, guide):
                  raise AssertionError(f'guide contains secret-like pattern: {p}')

          # Cleanliness: no superseded/temp user-guide drafts or helper workflows may survive final gate.
          allowed_user_guide_files = {
              'documentation/user-guide.md',
              'documentation/user-guide-project-plan.md',
              'documentation/user-guide-controller-journal.md',
          }
          suspicious = []
          for p in Path('documentation').rglob('*user-guide*'):
              if not p.is_file():
                  continue
              s = p.as_posix()
              if s.startswith('documentation/user-guide-audits/') or s.startswith('documentation/images/user-guide/') or s in allowed_user_guide_files:
                  continue
              suspicious.append(s)
          if suspicious:
              raise AssertionError(f'unexpected/superseded user-guide artifacts: {suspicious}')
          helpers = list(Path('.github/workflows').glob('ug00*-*.yml')) + list(Path('.github/workflows').glob('ug00*-*.yaml'))
          helpers = [p for p in helpers if p.name != 'ug005-producer-finalise.yml']
          if helpers:
              raise AssertionError(f'stale temporary user-guide workflows: {[p.as_posix() for p in helpers]}')

          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1363,936')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 25)
          checked = []
          try:
              # Root redirect must match reconciled route map.
              driver.get('https://discoverbouldersmarkets.vercel.app/')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME,'body'), 'Admin / Data Load Monitoring'))
              if not driver.current_url.rstrip('/').endswith('/admin'):
                  raise AssertionError(f'root did not resolve to /admin: {driver.current_url}')
              checked.append(('/', driver.current_url, 'Admin / Data Load Monitoring'))

              routes = [
                  ('/admin','Admin / Data Load Monitoring'),
                  ('/markets','Markets / Instrument Overview'),
                  ('/markets/amd','AMD'),
                  ('/assessments','Assessments'),
                  ('/assessments/gld','GLD'),
                  ('/opportunities','Opportunity'),
                  ('/opportunities/ai_advanced_packaging','Advanced Packaging'),
              ]
              for route, marker in routes:
                  driver.get('https://discoverbouldersmarkets.vercel.app' + route)
                  wait.until(EC.text_to_be_present_in_element((By.TAG_NAME,'body'), marker))
                  text = driver.find_element(By.TAG_NAME,'body').text
                  if re.search(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', text, re.I):
                      raise AssertionError(f'public route exposes email: {route}')
                  checked.append((route, driver.current_url, marker))

              private = [
                  ('/watchlists','Sign in to use watchlists'),
                  ('/alerts','Sign in to use alerts'),
                  ('/strategies','Sign in to view strategy evidence'),
              ]
              driver.delete_all_cookies()
              for route, marker in private:
                  driver.get('https://discoverbouldersmarkets.vercel.app' + route)
                  wait.until(EC.text_to_be_present_in_element((By.TAG_NAME,'body'), marker))
                  checked.append((route, driver.current_url, marker))

              # Final narrow-screen production QA.
              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride', {'width':390,'height':844,'deviceScaleFactor':1,'mobile':False})
              driver.get('https://discoverbouldersmarkets.vercel.app/markets')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME,'body'), 'Markets / Instrument Overview'))
              metrics = driver.execute_script('''
                const nav=document.querySelector('.sideNav nav');
                const item=document.querySelector('.navItem');
                const header=document.querySelector('.pageHeader');
                const table=document.querySelector('.tableScroll');
                const filter=document.querySelector('.filterTab');
                return {w:innerWidth,h:innerHeight,doc:document.documentElement.scrollWidth,
                  navClient:nav.clientWidth,navScroll:nav.scrollWidth,itemH:item.getBoundingClientRect().height,
                  flex:getComputedStyle(header).flexDirection,tableClient:table.clientWidth,tableScroll:table.scrollWidth,
                  filterH:filter.getBoundingClientRect().height};
              ''')
              if not (metrics['w']==390 and metrics['h']==844 and metrics['doc']<=390 and metrics['navScroll']>metrics['navClient'] and metrics['itemH']>=43 and metrics['flex']=='column' and metrics['tableScroll']>metrics['tableClient'] and metrics['filterH']>=43):
                  raise AssertionError(f'mobile production contract failed: {metrics}')
          finally:
              driver.quit()

          print('LINKS_OK', len(relative_links), sorted(set(relative_links)))
          print('IMAGES_OK', images)
          print('ROUTES_OK', checked)
          print('MOBILE_OK', metrics)
          PY

          # Create final-gate Producer evidence before transitioning state.
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess

          now = datetime.now(ZoneInfo('Australia/Perth')).isoformat(timespec='seconds')
          functional = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          evidence = f'''# UGUIDE-005 — Producer final assembly and publication QA evidence\n\n**Gate:** Final assembly and publication QA  \n**Producer state:** READY_FOR_AUDIT  \n**Functional implementation commit:** `{functional}`  \n**Data or schema effects:** none  \n**Evidence timestamp:** {now} (Australia/Perth)\n\n## Final assembly completed\n\n- Reconciled `documentation/frontend-route-map.md` so production `/` correctly redirects to `/admin`; updated its reconciliation date.\n- Updated `documentation/README.md` so the Platform User Guide is linked as canonical production user documentation rather than an under-construction artifact.\n- Updated the guide status to a final publication candidate pending independent UGUIDE-005 audit.\n- Retained explicit `AUTH_REQUIRED` disclosures for Watchlists, Alerts and Strategy owner screenshots because no already-authorised permanent-owner session was available; no sign-in form was substituted as instructional evidence and no private state was fabricated.\n- Retained six genuine delivered screenshots. The three owner-only manifest entries remain documented policy exceptions under the authenticated-screenshot rule.\n\n## Publication QA\n\n- Live root route independently resolved to `/admin` and rendered Admin / Data Load Monitoring.\n- Verified current production `/admin`, `/markets`, `/markets/amd`, `/assessments`, `/assessments/gld`, `/opportunities`, `/opportunities/ai_advanced_packaging`.\n- Verified signed-out owner boundaries for `/watchlists`, `/alerts` and `/strategies`.\n- Re-verified `/markets` at 390 × 844 CSS pixels: no page-level horizontal overflow, horizontal primary-navigation scrolling, stacked page header, table-contained horizontal scrolling and >=44px navigation/filter controls.\n- Every relative Markdown link in the guide resolves in the repository.\n- All six embedded guide images resolve, decode as real images and have non-trivial visual variation.\n- Every embedded image has meaningful alt text and an immediate explanatory caption.\n- The guide still states the no-live-trading and non-personalised-advice boundaries and preserves `VALIDATE_ROBUSTNESS / continue_testing`.\n- Guide privacy scan found no email addresses or common JWT/API-key/secret patterns.\n- No superseded user-guide draft or stale temporary user-guide workflow remained before the final handoff tooling.\n\n## Known limitations / accepted policy exceptions\n\n- `watchlists-owner-desktop.png`, `alerts-owner-desktop.png` and `strategy-result-desktop.png` remain absent under `AUTH_REQUIRED`; the current session did not provide an already-authorised permanent-owner Trading session. The project policy explicitly requires `AUTH_REQUIRED` rather than requesting credentials or fabricating private evidence.\n- Screenshot values are point-in-time examples; captions instruct users to rely on current labels/timestamps rather than captured values.\n\n## Exact next action\n\nUGUIDE-005 must move to `IN REVIEW` under the AUDITOR. The Auditor independently reconciles the final guide/index/route-map functional commit `{functional}`, current production routes, six delivered screenshots and the authenticated-screenshot policy exception. Only the Auditor may mark UGUIDE-005 DONE and record `USER_GUIDE_PROJECT_COMPLETE`.\n'''
          Path('documentation/user-guide-audits/UGUIDE-005.md').write_text(evidence)
          PY

          git add documentation/user-guide-audits/UGUIDE-005.md
          git commit -m 'docs(UGUIDE-005): record final publication QA evidence'
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          functional = subprocess.check_output(['git','rev-parse','HEAD~1'], text=True).strip()
          # HEAD~1 here is functional commit because current HEAD is evidence commit.
          evidence_commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          plan_path = Path('documentation/user-guide-project-plan.md')
          plan = plan_path.read_text()
          plan = plan.replace('| UGUIDE-005 | **NEXT** | Final assembly and publication QA |', '| UGUIDE-005 | **IN REVIEW** | Final assembly and publication QA |', 1)
          idx = plan.index('## Current controller handoff')
          plan = plan[:idx] + f'''## Current controller handoff\n\n```yaml\ntask_id: UGUIDE-005\nhandoff_owner: AUDITOR\nhandoff_status: READY_FOR_AUDIT\ncurrent_status: IN REVIEW\nimplementation_commit_or_range:\n  functional_commit: {functional}\n  producer_evidence_commit: {evidence_commit}\nfiles_changed:\n  implementation:\n    - documentation/user-guide.md\n    - documentation/README.md\n    - documentation/frontend-route-map.md\n  current_delivery_control:\n    - documentation/user-guide-audits/UGUIDE-005.md\n    - documentation/user-guide-project-plan.md\n    - documentation/user-guide-controller-journal.md\nscreenshots_added_or_replaced: none; six existing production screenshots were revalidated; three owner-only entries remain AUTH_REQUIRED under policy\nroutes_and_viewports_verified:\n  desktop_1363x936:\n    - / -> /admin\n    - /admin\n    - /markets\n    - /markets/amd\n    - /assessments\n    - /assessments/gld\n    - /opportunities\n    - /opportunities/ai_advanced_packaging\n    - /watchlists signed-out owner boundary\n    - /alerts signed-out owner boundary\n    - /strategies signed-out owner boundary\n  narrow_390x844:\n    - /markets\ndata_or_schema_effects: none\ntests_and_checks:\n  - root-route documentation reconciled to production / -> /admin\n  - canonical guide linked from documentation/README.md as production user documentation\n  - all relative guide Markdown links resolve\n  - all six delivered embedded images resolve, decode, have meaningful alt text and immediate captions\n  - current public and signed-out private route examples resolve in production\n  - narrow Markets route retains horizontal nav/table scrolling, stacked header, >=44px controls and no page-level horizontal overflow\n  - guide privacy scan found no email/JWT/API-key/common-secret pattern\n  - no superseded user-guide draft or stale temporary user-guide workflow remains outside current transient finalisation helper\nknown_limitations:\n  - Watchlists, Alerts and Strategy owner screenshots remain AUTH_REQUIRED because no already-authorised permanent-owner Trading session was available; no private evidence was fabricated\nacceptance_criteria_evidence:\n  canonical_guide: documentation/user-guide.md\n  documentation_index: documentation/README.md\n  reconciled_route_map: documentation/frontend-route-map.md\n  producer_evidence: documentation/user-guide-audits/UGUIDE-005.md\nexact_next_action: Auditor independently audits UGUIDE-005 only; on PASS it marks UGUIDE-005 DONE, records USER_GUIDE_PROJECT_COMPLETE and promotes no successor\n```\n'''
          plan_path.write_text(plan)
          PY

          git add documentation/user-guide-project-plan.md
          git commit -m 'docs(UGUIDE-005): move final publication QA to review'
          PLAN_COMMIT="$(git rev-parse HEAD)"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess

          now = datetime.now(ZoneInfo('Australia/Perth')).isoformat(timespec='seconds')
          # functional is three commits behind current HEAD: functional, evidence, plan
          functional = subprocess.check_output(['git','rev-parse','HEAD~2'], text=True).strip()
          evidence = subprocess.check_output(['git','rev-parse','HEAD~1'], text=True).strip()
          plan_commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          journal_path = Path('documentation/user-guide-controller-journal.md')
          journal = journal_path.read_text()
          old_prefix = 'project_status: ACTIVE\nactive_task: UGUIDE-005\nactive_task_status: IN PROGRESS\nhandoff_owner: PRODUCER\nhandoff_status: IN PROGRESS'
          if old_prefix not in journal:
              raise SystemExit('UGUIDE-005 journal state drifted before handoff.')
          import re
          journal = re.sub(
              r'project_status: ACTIVE\nactive_task: UGUIDE-005\nactive_task_status: IN PROGRESS\nhandoff_owner: PRODUCER\nhandoff_status: IN PROGRESS\nlast_updated: [^\n]+\ncompleted_task: UGUIDE-004\naudit_decision: PASS_WITH_ADVICE\nnext_action: complete UGUIDE-005 final assembly, production reconciliation and publication QA, then hand to Auditor',
              f'project_status: ACTIVE\nactive_task: UGUIDE-005\nactive_task_status: IN REVIEW\nhandoff_owner: AUDITOR\nhandoff_status: READY_FOR_AUDIT\nlast_updated: {now}\ncompleted_task: UGUIDE-004\naudit_decision: PENDING\nnext_action: Auditor independently audits UGUIDE-005 final assembly and publication QA; only Auditor may complete the project',
              journal,
              count=1,
          )
          journal += f'''\n\n### {now} — PRODUCER_HANDOFF\n\n```yaml\nevent: PRODUCER_HANDOFF\ntask_id: UGUIDE-005\nhandoff_from: PRODUCER\nhandoff_to: AUDITOR\nhandoff_status: READY_FOR_AUDIT\nimplementation_commit_or_range:\n  functional_commit: {functional}\n  producer_evidence_commit: {evidence}\n  plan_transition_commit: {plan_commit}\nfiles_changed:\n  implementation:\n    - documentation/user-guide.md\n    - documentation/README.md\n    - documentation/frontend-route-map.md\n  delivery_control:\n    - documentation/user-guide-audits/UGUIDE-005.md\n    - documentation/user-guide-project-plan.md\n    - documentation/user-guide-controller-journal.md\nscreenshots_added_or_replaced: none; six delivered screenshots revalidated; owner-only Watchlists/Alerts/Strategy screenshots remain AUTH_REQUIRED under policy\nroutes_and_viewports_verified:\n  desktop_1363x936: / -> /admin; /admin; /markets; /markets/amd; /assessments; /assessments/gld; /opportunities; /opportunities/ai_advanced_packaging; signed-out /watchlists; /alerts; /strategies\n  narrow_390x844: /markets\ndata_or_schema_effects: none\ntests_and_checks:\n  - reconciled root route and documentation index\n  - verified every relative guide link and all six embedded images\n  - verified meaningful alt text and immediate captions for each delivered image\n  - verified live public routes and private signed-out boundaries\n  - reverified genuine narrow production behaviour\n  - privacy/secret-pattern scan passed\n  - stale/superseded user-guide artifact scan passed\nknown_limitations:\n  - no already-authorised permanent-owner Trading browser session existed for the three owner-only screenshots; AUTH_REQUIRED retained exactly as policy requires\nacceptance_criteria_evidence:\n  guide: documentation/user-guide.md\n  index: documentation/README.md\n  route_map: documentation/frontend-route-map.md\n  evidence: documentation/user-guide-audits/UGUIDE-005.md\nexact_next_action: Auditor independently audits the final gate. Producer must not mark UGUIDE-005 DONE or record USER_GUIDE_PROJECT_COMPLETE.\n```\n'''
          journal_path.write_text(journal)
          PY

          git add documentation/user-guide-controller-journal.md
          git commit -m 'docs(UGUIDE-005): hand final user guide to auditor'
          git push origin HEAD:main
