name: APPGUIDE-002 independent Auditor QA

'on':
  push:
    paths:
      - .github/workflows/appguide-002-auditor.yml

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          npm install --no-package-lock
          python3 -m pip install --quiet selenium

      - name: Independently reproduce repository checks
        run: |
          npm test
          npm run check:palette
          npm run build

      - name: Independently verify local and live Help
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/appguide-002-auditor-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/help > /dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import re
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          LOCAL = 'http://127.0.0.1:3000'
          LIVE = 'https://discoverbouldersmarkets.vercel.app'
          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1363,936')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 30)

          def audit(base, label):
              driver.execute_cdp_cmd('Emulation.clearDeviceMetricsOverride', {})
              driver.set_window_size(1363, 936)
              driver.get(base + '/help')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'Discover Boulders Markets — User Guide'))
              body = driver.find_element(By.TAG_NAME, 'body')
              article = driver.find_element(By.CSS_SELECTOR, 'article[data-guide-source="documentation/user-guide.md"]')
              help_link = driver.find_element(By.CSS_SELECTOR, 'a.navItem[href="/help"]')
              assert help_link.text.strip().endswith('Help')
              assert help_link.get_attribute('href').endswith('/help')
              assert 'navActive' in (help_link.get_attribute('class') or '')
              assert help_link.get_property('tabIndex') == 0
              assert help_link.is_displayed() and help_link.is_enabled()
              driver.execute_script('arguments[0].focus()', help_link)
              assert driver.switch_to.active_element.get_attribute('href').endswith('/help')
              focus_style = driver.execute_script('''
                const s=getComputedStyle(arguments[0]);
                return {outline:s.outlineStyle, outlineWidth:s.outlineWidth, boxShadow:s.boxShadow};
              ''', help_link)
              assert focus_style['outline'] != 'none' or focus_style['boxShadow'] != 'none', focus_style
              help_link.send_keys(Keys.ENTER)
              wait.until(lambda d: d.current_url.rstrip('/').endswith('/help'))

              text = body.text
              assert 'In-app Help:' in text
              assert 'research and monitoring platform' in text
              assert 'does not place live trades' in text
              assert 'not personalised financial advice' in text
              assert 'Help' in text
              tables = article.find_elements(By.CSS_SELECTOR, 'table')
              assert len(tables) >= 4, len(tables)
              doc_links = article.find_elements(By.CSS_SELECTOR, 'a[href^="https://github.com/ClimbingBuddies/Trading/blob/main/"]')
              assert doc_links, 'No canonical GitHub documentation links rendered'
              external = article.find_elements(By.CSS_SELECTOR, 'a[href="https://discoverbouldersmarkets.vercel.app"]')
              assert external and external[0].get_attribute('target') == '_blank'

              images = article.find_elements(By.CSS_SELECTOR, 'img')
              assert len(images) == 6, len(images)
              for image in images:
                  assert len((image.get_attribute('alt') or '').strip()) >= 20
                  src = image.get_attribute('src') or ''
                  assert '/generated/user-guide/' in src, src
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'})", image)
                  wait.until(lambda d, img=image: d.execute_script('return arguments[0].complete && arguments[0].naturalWidth > 0', img))

              assert not re.search(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', text, re.I)
              assert not re.search(r'eyJ[a-zA-Z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]+|sk-[A-Za-z0-9]{20,}', text)

              driver.get(base + '/help#compact-glossary')
              heading = wait.until(EC.presence_of_element_located((By.ID, 'compact-glossary')))
              top = driver.execute_script('return arguments[0].getBoundingClientRect().top', heading)
              assert -20 <= top <= 180, top

              driver.get(base + '/markets')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, 'a.navItem[href="/help"]')))
              help_on_markets = driver.find_element(By.CSS_SELECTOR, 'a.navItem[href="/help"]')
              markets_link = driver.find_element(By.CSS_SELECTOR, 'a.navItem[href="/markets"]')
              assert 'navActive' not in (help_on_markets.get_attribute('class') or '')
              assert 'navActive' in (markets_link.get_attribute('class') or '')

              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride', {
                  'width': 390, 'height': 844, 'deviceScaleFactor': 1, 'mobile': False,
              })
              driver.get(base + '/help')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'Discover Boulders Markets — User Guide'))
              metrics = driver.execute_script('''
                const nav=document.querySelector('.sideNav nav');
                const help=document.querySelector('a.navItem[href="/help"]');
                const article=document.querySelector('article[data-guide-source="documentation/user-guide.md"]');
                const region=document.querySelector('[role="region"][aria-label="Scrollable user-guide table"]');
                const image=article.querySelector('img');
                return {w:innerWidth,h:innerHeight,doc:document.documentElement.scrollWidth,
                  navClient:nav.clientWidth,navScroll:nav.scrollWidth,helpH:help.getBoundingClientRect().height,
                  helpActive:help.classList.contains('navActive'),articleW:article.getBoundingClientRect().width,
                  regionClient:region.clientWidth,regionScroll:region.scrollWidth,imageW:image.getBoundingClientRect().width,
                  dpl:document.documentElement.getAttribute('data-dpl-id')};
              ''')
              assert metrics['w'] == 390 and metrics['h'] == 844, metrics
              assert metrics['doc'] <= 390, metrics
              assert metrics['navScroll'] > metrics['navClient'], metrics
              assert metrics['helpH'] >= 43 and metrics['helpActive'], metrics
              assert metrics['articleW'] <= 390 and metrics['imageW'] <= metrics['articleW'], metrics
              assert metrics['regionScroll'] > metrics['regionClient'], metrics
              print(f'APPGUIDE_002_AUDITOR_{label}_PASS', metrics, focus_style)

          try:
              audit(LOCAL, 'LOCAL')
              audit(LIVE, 'PRODUCTION')
          finally:
              driver.quit()
          PY
