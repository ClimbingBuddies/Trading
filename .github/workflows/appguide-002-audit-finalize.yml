name: APPGUIDE-002 audit completion finalizer

'on':
  push:
    paths:
      - .github/workflows/appguide-002-audit-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist independent Auditor PASS and project completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Australia/Perth')).isoformat(timespec='seconds')
          plan_path = Path('documentation/in-app-user-guide-project-plan.md')
          journal_path = Path('documentation/in-app-user-guide-controller-journal.md')
          audit_path = Path('documentation/in-app-user-guide-audits/APPGUIDE-002.md')

          plan = plan_path.read_text()
          journal = journal_path.read_text()
          audit = audit_path.read_text()

          old_gate = '| APPGUIDE-002 | **IN REVIEW** | Navigation and production completion |'
          new_gate = '| APPGUIDE-002 | **DONE** | Navigation and production completion |'
          assert old_gate in plan
          plan = plan.replace(old_gate, new_gate, 1)

          heading = '## Current controller handoff'
          assert heading in plan
          plan = plan[:plan.index(heading)] + '''## Current controller handoff\n\n```yaml\ntask_id: APPGUIDE-002\nhandoff_owner: NONE\nhandoff_status: COMPLETE\ncurrent_status: DONE\nproject_status: IN_APP_USER_GUIDE_PROJECT_COMPLETE\ncompleted_task: APPGUIDE-002\naudit_decision: PASS\nimplementation_commit_reviewed: bed0f674f6b317f7d13390d5f262d1e9b8b290f6\nproducer_evidence_commit_reviewed: 78f16592c2d0db3542d064033266033ba59e5850\nindependent_audit_run: GitHub Actions run 32935825791 / job 98076732661 PASS\naudit_helper_cleanup_commit: 7684d766370256d33f7d6e84a93342bd02b7dfd1\ndata_or_schema_effects: none\ncomplete_correction_set: none\nnext_action: none — IN_APP_USER_GUIDE_PROJECT_COMPLETE\n```\n'''
          plan_path.write_text(plan)

          old_state = '''project_status: ACTIVE\nactive_task: APPGUIDE-002\nactive_task_status: IN REVIEW\nhandoff_owner: AUDITOR\nhandoff_status: READY_FOR_AUDIT\ncompleted_task: APPGUIDE-001\naudit_decision: PENDING\nnext_action: Auditor independently audits APPGUIDE-002 final navigation and production completion only'''
          new_state = '''project_status: IN_APP_USER_GUIDE_PROJECT_COMPLETE\nactive_task: none\nactive_task_status: DONE\nhandoff_owner: none\nhandoff_status: COMPLETE\ncompleted_task: APPGUIDE-002\naudit_decision: PASS\nnext_action: none — project complete'''
          assert old_state in journal
          journal = journal.replace(old_state, new_state, 1)
          journal += f'''\n\n### {now} — AUDIT_DECISION\n\n```yaml\nevent: AUDIT_DECISION\ntask_id: APPGUIDE-002\ncontroller: AUDITOR\ndecision: PASS\nimplementation_commit_or_range_reviewed: bed0f674f6b317f7d13390d5f262d1e9b8b290f6\nproducer_evidence_commit_reviewed: 78f16592c2d0db3542d064033266033ba59e5850\naudit_record: documentation/in-app-user-guide-audits/APPGUIDE-002.md\nindependent_evidence: GitHub Actions run 32935825791 / job 98076732661 PASS\nchecks_performed:\n  - exact five-file functional commit independently inspected\n  - current components/AppNav.tsx confirms Help /help entry and shared active-state rule\n  - current app/help/page.tsx and lib/user-guide.ts confirm documentation/user-guide.md remains the sole editable guide prose source\n  - npm test independently reproduced 10/10 PASS\n  - npm run check:palette independently reproduced PASS\n  - npm run build independently reproduced PASS with /help static prerender and six canonical screenshot assets\n  - local production-mode browser audit passed desktop and exactly 390x844\n  - live production browser audit passed desktop and exactly 390x844\n  - Help visible focus treatment, native focusability and Enter activation independently verified\n  - active-state switching verified: Help active on /help and not active on /markets while Markets is active\n  - canonical title, research/no-live-trading/no-personalised-advice boundaries, four-plus tables, all six screenshots, representative GitHub documentation links and direct #compact-glossary anchor independently verified\n  - privacy/secret-pattern checks independently passed\n  - mobile metrics independently reproduced: document 375px; article 355px; Help target 44px; nav 350/818px client/scroll; table 319/680px client/scroll; image 321px at 390x844\n  - temporary Auditor workflow removed; fresh .github/workflows lookup returned 404\ncomplete_correction_set: none\nproject_status_after_audit: IN_APP_USER_GUIDE_PROJECT_COMPLETE\nnext_task_promoted: none\nexact_next_action: none; the in-app User Guide project is complete\n```\n'''
          journal_path.write_text(journal)

          audit += f'''\n\n## Independent Auditor decision\n\n**Decision:** PASS  \n**Audited at:** {now}  \n**Functional implementation reviewed:** `bed0f674f6b317f7d13390d5f262d1e9b8b290f6`  \n**Independent evidence:** GitHub Actions run `32935825791`, job `98076732661` — PASS  \n**Data or schema effects:** none  \n**Complete correction set:** none  \n**Project result:** `IN_APP_USER_GUIDE_PROJECT_COMPLETE`\n\n### Independent findings\n\nThe Auditor independently reproduced the final gate from a fresh checkout with a read-only audit workflow and did not rely on the Producer's browser results. The exact five-file functional commit matches the handoff. Current source still reads `documentation/user-guide.md` directly through `lib/user-guide.ts`; APPGUIDE-002 introduced only navigation, documentation reconciliation and a deterministic navigation test, with no duplicate guide prose.\n\nIndependent repository checks passed: `npm test` 10/10, palette compliance, and a production Next.js build with `/help` statically prerendered and exactly six canonical screenshot assets published.\n\nIndependent local and live browser checks both passed at desktop and exactly 390 × 844 CSS pixels. Help is visible, active only on `/help`, natively focusable, Enter-activatable and has a visible focus treatment (`outline: auto`, 1px plus inset focus shadow). `/markets` correctly activates Markets instead of Help. The title, research/no-live-trading/no-personalised-advice boundaries, rendered tables, all six lazy-loaded screenshots with meaningful alt text, representative GitHub documentation links, the external production link and `/help#compact-glossary` all worked. Privacy/secret-pattern scans found no email address, owner identity, token or secret-like string.\n\nAt 390 × 844 the independently reproduced metrics were: document width 375px, article 355px, Help target 44px, navigation 350px client / 818px scroll, table region 319px client / 680px scroll and first image 321px. There was no page-level horizontal overflow; navigation and wide tables retained contained horizontal scrolling.\n\nThe temporary Auditor workflow was removed after evidence capture and a fresh `.github/workflows` lookup returned 404. No implementation fixes were made while acting as Auditor.\n\n### Final decision\n\nAPPGUIDE-002 satisfies every acceptance criterion. Both APPGUIDE-001 and APPGUIDE-002 are independently audited and DONE. No successor gate is promoted. The project terminates at `IN_APP_USER_GUIDE_PROJECT_COMPLETE`.\n'''
          audit_path.write_text(audit)
          PY

          git config user.name 'ClimbingBuddies In-App Guide Auditor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documentation/in-app-user-guide-project-plan.md documentation/in-app-user-guide-controller-journal.md documentation/in-app-user-guide-audits/APPGUIDE-002.md
          git commit -m 'docs(APPGUIDE-002): pass final audit and complete in-app guide project'
          git push origin HEAD:main
