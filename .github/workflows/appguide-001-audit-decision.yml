name: APPGUIDE-001 Auditor decision

'on':
  push:
    paths:
      - .github/workflows/appguide-001-audit-decision.yml

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist APPGUIDE-001 audit decision
        run: python3 .github/scripts/appguide_001_audit_decision.py
      - name: Commit audit state
        run: |
          git config user.name 'ClimbingBuddies In-App Guide Auditor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documentation/in-app-user-guide-project-plan.md documentation/in-app-user-guide-controller-journal.md documentation/in-app-user-guide-audits/APPGUIDE-001.md
          git commit -m 'docs(APPGUIDE-001): pass rendering audit and promote navigation'
          git push origin HEAD:main
