name: UGUIDE-004 auditor evidence

'on':
  push:
    paths:
      - .github/workflows/ug004-auditor-evidence.yml

permissions:
  contents: read

jobs:
  audit-production-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install browser audit dependencies
        run: python3 -m pip install --quiet pillow selenium

      - name: Independently verify screenshots and responsive production behaviour
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image, ImageStat
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          def verify_image(path, expected=None, min_size=None):
              p = Path(path)
              if not p.exists():
                  raise AssertionError(f'missing image: {path}')
              image = Image.open(p)
              image.verify()
              image = Image.open(p).convert('RGB')
              if expected and image.size != expected:
                  raise AssertionError(f'{path}: expected {expected}, got {image.size}')
              if min_size and (image.width < min_size[0] or image.height < min_size[1]):
                  raise AssertionError(f'{path}: too small {image.size}')
              stddev = ImageStat.Stat(image.convert('L')).stddev[0]
              colours = len(set(image.resize((80, 80)).getdata()))
              if stddev < 12 or colours < 80:
                  raise AssertionError(f'{path}: image appears blank/degenerate stddev={stddev:.2f} colours={colours}')
              print(f'IMAGE_OK {path} size={image.size} stddev={stddev:.2f} sampled_colours={colours}')

          verify_image('documentation/images/user-guide/markets-overview-mobile.png', expected=(390, 844))
          verify_image('documentation/images/user-guide/admin-health-desktop.jpg', min_size=(1200, 800))

          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1363,936')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 20)

          try:
              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride', {
                  'width': 390,
                  'height': 844,
                  'deviceScaleFactor': 1,
                  'mobile': False,
              })
              driver.get('https://discoverbouldersmarkets.vercel.app/markets')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'Markets / Instrument Overview'))
              mobile = driver.execute_script('''
                const nav = document.querySelector('.sideNav nav');
                const firstNav = document.querySelector('.navItem');
                const header = document.querySelector('.pageHeader');
                const table = document.querySelector('.tableScroll');
                const search = document.querySelector('.searchBox input');
                const filter = document.querySelector('.filterTab');
                return {
                  innerWidth: window.innerWidth,
                  innerHeight: window.innerHeight,
                  documentWidth: document.documentElement.scrollWidth,
                  navClientWidth: nav?.clientWidth || 0,
                  navScrollWidth: nav?.scrollWidth || 0,
                  navItemHeight: firstNav?.getBoundingClientRect().height || 0,
                  headerFlexDirection: header ? getComputedStyle(header).flexDirection : null,
                  tableClientWidth: table?.clientWidth || 0,
                  tableScrollWidth: table?.scrollWidth || 0,
                  searchWidth: search?.getBoundingClientRect().width || 0,
                  filterHeight: filter?.getBoundingClientRect().height || 0,
                  bodyText: document.body.innerText,
                };
              ''')
              print('MOBILE_METRICS', mobile)
              assert mobile['innerWidth'] == 390, mobile
              assert mobile['innerHeight'] == 844, mobile
              assert mobile['documentWidth'] <= 390, mobile
              assert mobile['navScrollWidth'] > mobile['navClientWidth'], mobile
              assert mobile['navItemHeight'] >= 43, mobile
              assert mobile['headerFlexDirection'] == 'column', mobile
              assert mobile['tableScrollWidth'] > mobile['tableClientWidth'], mobile
              assert mobile['searchWidth'] >= 300, mobile
              assert mobile['filterHeight'] >= 43, mobile
              text = mobile['bodyText']
              for required in ['Markets / Instrument Overview', 'Instrument Overview', 'Search instruments', 'Market Data Status Summary']:
                  assert required in text, required
              assert not re.search(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', text, re.I), 'email leaked on public mobile route'
              driver.save_screenshot('/tmp/ug004-auditor-mobile.png')
              fresh = Image.open('/tmp/ug004-auditor-mobile.png')
              assert fresh.size == (390, 844), fresh.size
              print('MOBILE_LIVE_OK screenshot_size=', fresh.size)

              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride', {
                  'width': 1363,
                  'height': 936,
                  'deviceScaleFactor': 1,
                  'mobile': False,
              })
              driver.get('https://discoverbouldersmarkets.vercel.app/admin')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'Admin / Data Load Monitoring'))
              admin_text = driver.find_element(By.TAG_NAME, 'body').text
              for required in ['Loader Health', 'DATA FRESHNESS', 'OPPORTUNITY ENGINE', 'TECHNICAL ENGINE', 'Recent Load History']:
                  assert required in admin_text, required
              assert not re.search(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', admin_text, re.I), 'email leaked on public admin route'
              print('ADMIN_LIVE_OK')

              driver.delete_all_cookies()
              driver.get('https://discoverbouldersmarkets.vercel.app/strategies')
              wait.until(EC.text_to_be_present_in_element((By.TAG_NAME, 'body'), 'Sign in to view strategy evidence'))
              strategy_text = driver.find_element(By.TAG_NAME, 'body').text
              assert 'Send secure sign-in link' in strategy_text
              assert 'Real strategy tests and review outcomes are private to their owner.' in strategy_text
              print('STRATEGY_SIGNED_OUT_BOUNDARY_OK')
          finally:
              driver.quit()
          PY
