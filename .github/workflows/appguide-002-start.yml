name: APPGUIDE-002 Producer start

'on':
  push:
    paths:
      - .github/workflows/appguide-002-start.yml

permissions:
  contents: write

jobs:
  persist-start:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record BUILD_ATTEMPT_STARTED
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('documentation/in-app-user-guide-controller-journal.md')
          text = p.read_text()
          old = '''project_status: ACTIVE
          active_task: APPGUIDE-002
          active_task_status: NEXT
          handoff_owner: PRODUCER
          handoff_status: AUTHORISED
          completed_task: APPGUIDE-001
          audit_decision: PASS
          next_action: Producer retrieves authoritative state fresh, records BUILD_ATTEMPT_STARTED and implements APPGUIDE-002 only'''
          new = '''project_status: ACTIVE
          active_task: APPGUIDE-002
          active_task_status: IN PROGRESS
          handoff_owner: PRODUCER
          handoff_status: IN PROGRESS
          completed_task: APPGUIDE-001
          audit_decision: PASS
          next_action: Producer implements and verifies APPGUIDE-002 navigation and production completion only, then hands it to Auditor'''
          assert old in text
          text = text.replace(old, new, 1)
          text += '''\n\n### 2026-08-26T13:31:00+08:00 — BUILD_ATTEMPT_STARTED\n\n```yaml\nevent: BUILD_ATTEMPT_STARTED\ntask_id: APPGUIDE-002\ncontroller: PRODUCER\nstarting_commit: 9aed5a075a4a86677df8c0c256671e6802d4c4eb\nplan_blob: 3f94dc308f74468b832edb837cf5cea1eaaf0ff5\njournal_blob_before_start: eb3f42dc4a71b9c75f4e58f91b1ee5d9b91ee69c\ncontroller_blob: 279b60b128f006c8903f02c70a968d86430e715a\ncanonical_guide_blob: 68bdfc34e106f95eaaaf286299100ed93994619e\ndevelopment_workflow_blob: e04dfa048b5b42767db4feb43d86f3738cd3c07c\napp_nav_blob: 0e122a5efdb5c8fdbe6be00581533f8496857819\nfrontend_route_map_blob: d0b4cf1e8c01a225fbd409263af5e184286bab97\npackage_blob: 71a52a374274ce3b8b50c75531dfd950bcf5d268\nproduction_baseline_deployment: dpl_29tXzvNwBi5h2TeEJNHodENaERSY\nplan_state_observed: APPGUIDE-001 DONE; APPGUIDE-002 NEXT\nhandoff_observed: APPGUIDE-002 AUTHORISED to PRODUCER with no unresolved HANDOFF_QUERY\nintended_scope: add Help to the primary navigation, add deterministic navigation/reconciliation checks, minimally reconcile the canonical guide and documentation index/route map, deploy through the normal production path, and verify production desktop plus 390x844 behaviour; do not make Supabase, auth, trading-methodology or schedule changes\ndata_or_schema_effects: none\n```\n'''
          p.write_text(text)
          PY
          git config user.name 'ClimbingBuddies In-App Guide Producer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documentation/in-app-user-guide-controller-journal.md
          git commit -m 'docs(APPGUIDE-002): record Producer start'
          git push origin HEAD:main
