name: APPGUIDE-001 Auditor QA

'on':
  push:
    paths:
      - .github/workflows/appguide-001-auditor.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install application dependencies
        run: npm install --no-package-lock
      - name: Install browser dependency
        run: python3 -m pip install --quiet selenium
      - name: Run repository tests
        run: npm test
      - name: Run palette compliance
        run: npm run check:palette
      - name: Build production app
        run: npm run build
      - name: Start production server and independently audit Help
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/appguide-audit-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/help > /dev/null; then break; fi
            sleep 1
          done
          python3 .github/scripts/appguide_001_auditor.py
